[tox]
envlist =
    py39-django{3.0,3.1,3.2,4.0,4.1,4.2},
    py310-django{3.2,4.0,4.1,4.2},
    py311-django{4.1,4.2},
    py312-django4.2,

[default]

[testenv]
basepython =
    py39: python3.9
    py310: python3.10
    py311: python3.11
    py312: python3.12
deps =
    pytz
    mock
    celery
    django-sendfile2
    python-dateutil
    Markdown
    djangorestframework
    django3.0: django<3.1
    django3.1: django<3.2
    django3.2: django<3.3
    django4.0: django<4.1
    django4.1: django<4.2
    django4.2: django<4.3
    git+https://github.com/jbradberry/django-turn-generation.git@2025-upgrade
    git+https://github.com/jbradberry/starslib.git@2025-upgrade
setenv =
    PYTHONPATH={toxinidir}
    DJANGO_SETTINGS_MODULE=sample_project.settings
commands = {envbindir}/django-admin test {posargs:starsweb}
