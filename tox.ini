[tox]
envlist =
    py310-django{4.0,4.1,4.2,5.0,5.1,5.2},
    py311-django{4.1,4.2,5.0,5.1,5.2},
    py312-django{4.2,5.0,5.1,5.2},
    py313-django{5.1,5.2},
    py314-django{5.2},

[default]

[testenv]
basepython =
    py310: python3.10
    py311: python3.11
    py312: python3.12
    py313: python3.13
    py314: python3.14
deps =
    pytz
    mock
    celery
    django-sendfile2
    python-dateutil
    Markdown
    nh3
    djangorestframework
    django4.0: django<4.1
    django4.1: django<4.2
    django4.2: django<4.3
    django5.0: django<5.1
    django5.1: django<5.2
    django5.2: django<5.3
    django6.0: django<6.1
    git+https://github.com/jbradberry/django-turn-generation.git@2025-upgrade
    git+https://github.com/jbradberry/starslib.git@2025-upgrade
setenv =
    PYTHONPATH={toxinidir}
    DJANGO_SETTINGS_MODULE=sample_project.settings
commands = {envpython} -Wd {envbindir}/django-admin test {posargs:starsweb}
