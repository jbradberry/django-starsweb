[tox]
envlist =
    py{38,39}-django{2.2,3.0,3.1,3.2},
    py310-django3.2

[default]

[testenv]
basepython =
    py38: python3.8
    py39: python3.9
    py310: python3.10
deps =
    pytz
    mock
    celery<5.3  # 5.2.7
    django-sendfile2
    python-dateutil
    Markdown
    djangorestframework<3.14
    django2.2: django<2.3
    django3.0: django<3.1
    django3.1: django<3.2
    django3.2: django<3.3
    git+https://github.com/jbradberry/django-turn-generation.git@2025-upgrade
    git+https://github.com/jbradberry/starslib.git@2025-upgrade
setenv =
    PYTHONPATH={toxinidir}
    DJANGO_SETTINGS_MODULE=sample_project.settings
commands = {envpython} {envbindir}/django-admin.py test {posargs:starsweb}
